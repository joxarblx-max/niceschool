 if(me.role=="student"){const lb=db.u.filter(x=>x.role=="student"&&x.school&&x.school==me.school).sort((a,b)=>b.coin-a.coin).slice(0,5);

 if(!sc||sc.st=="no"){let h=sc?`<div class=cd>❌ Rad etildi. Pulingiz 7 kun ichida qaytariladi.</div>`:"";

 if(sc.st=="wait")return `<div class=cd>⏳ Arizangiz 24 soat ichida admin tomonidan ko'rib chiqiladi.</div>`;
 const staff=db.u.filter(x=>x.school==sc.id&&x.role=="teacher"),pl=sc.type=="Hususiy"?POS:POS.slice(0,5);
 return `<div class=cd><h2>🏫 ${e(sc.name)}</h2><span class=badge>${sc.type}</span> <small class=mu>Hamkorlik muvaffaqiyatli!</small></div>
<div class=cd><h4>O'qituvchi qo'shish</h4><select id=tp>${pl.map((p,i)=>`<option value=${i}>${p}</option>`).join("")}</select><input id=tid placeholder="O'qituvchi ID"><button onclick="addT()">Zayafka yuborish</button></div>

<div class=cd><h4>O'quvchilar</h4>${db.u.filter(x=>x.school==sc.id&&x.role=="student").map(x=>`${e(x.name)} — ${e(x.cls)}`).join("<br>")||"<small class=mu>Yo'q</small>"}</div>

 if(!me.school)return h;const stu=db.u.filter(x=>x.school==me.school&&x.role=="student");
 if(me.pos=="Sinf rahbar")h+=`<div class=cd><h4>Sinfim</h4><input id=cl value="${e(me.cls||"")}" placeholder="Sinf (3-A)"><button onclick="me.cls=v('cl');save();render()">Saqlash</button>${me.cls?`<hr><input id=sid placeholder="O'quvchi ID"><button onclick="stuAdd()">➕ Sinfga qo'shish</button><br>${stu.filter(x=>x.cls==me.cls).map(x=>`${e(x.name)} (${x.id}) <button class=r onclick="U('${x.id}').school=null;U('${x.id}').cls=null;save();render()">Chiqarish</button>`).join("<br>")}`:""}</div>`;
 if(me.pos=="Fan o'qituvchi")h+=`<div class=cd><h4>Baho qo'yish</h4><select id=gs>${stu.map(x=>`<option value=${x.id}>${e(x.name)} (${e(x.cls||"-")})</option>`).join("")}</select><input id=sj placeholder="Fan"><select id=sc><option>5</option><option>4</option><option>3</option><option>2</option></select><button onclick="grade()">Baho qo'yish</button></div>`;return h}

 const d=gr(s.id).filter(x=>x.date==today()),good=d.filter(x=>x.score>=4).length,bad=d.filter(x=>x.score==2).length;
 if(sc>=4&&good==3)s.coin+=.5;if(sc==2&&bad==2)s.coin-=1;s.coin=+s.coin.toFixed(1);save();N("Baho qo'yildi");render()}

const EY=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#fff"/><circle cx="${x-1}" cy="${y}" r="2.2" fill="#111"/>`;

whale:(a,b)=>`<path d="M6 48Q10 16 54 18Q84 20 94 40L114 20L112 56L94 52Q70 74 36 68Q8 64 6 48Z" fill="${a}"/><ellipse cx="46" cy="58" rx="30" ry="8" fill="${b}" opacity=".7"/><path d="M40 18Q38 8 30 2M40 18Q44 8 52 4" stroke="#7dd3fc" stroke-width="3" fill="none" stroke-linecap="round"/>${EY(24,38)}`};
const ART={"White Fish":["fish","#f8fafc","#cbd5e1"],"Common Fish":["fish","#94a3b8","#64748b"],"Blue Fish":["fish","#3b82f6","#1e40af"],"Uncommon Fish":["fish","#22c55e","#15803d"],"Starfish":["star","#fb923c","#c2410c"],"Golden Fish":["fish","#fbbf24","#d97706"],"Dog Fish":["shark","#78716c","#44403c"],"Baby Fish":["fish","#f9a8d4","#db2777"],"Sea Horse":["horse","#f59e0b","#b45309"],"Baby Orca":["orca","#1e293b","#f8fafc"],"Dolphin":["orca","#60a5fa","#e0f2fe"],"Shark":["shark","#64748b","#334155"],"Rainbow Orca":["orca","url(#rb)","#f8fafc"],"Rainbow Octopus":["octo","url(#rb)","#fff"],"Meduza":["jelly","#c084fc","#a855f7"],"Sea Frog":["frog","#4ade80","#16a34a"],"Blup":["blob","#f472b6","#be185d"],"Kit":["whale","#1d4ed8","#93c5fd"]};
const fishArt=n=>{const[k,a,b]=ART[n]||ART["Common Fish"];return `<svg viewBox="0 0 120 80">${SH[k](a,b)}</svg>`};
const RC=[["#a16207","#78350f"],["#9ca3af","#4b5563"],["#e5e7eb","#9ca3af"],["#fbbf24","#d97706"],["#22d3ee","#0891b2"],["#4c1d95","#a78bfa"],["#1f1535","#a855f7"],["url(#rb)","#f43f5e"]];

let busy=0,last=null;
const catchV=c=>`<div class=catch><div class=cimg>${fishArt(c.nm)}</div><b style="font-size:20px">${c.nm}</b><br><span class=badge>${c.tier}</span> <b>+${c.coin} 🪙</b>${c.broke?"<br>💥 qarmoq sindi!":""}</div>`;
function gameV(){const r=me.rod;
 return `<div class=cd><h3>🎣 Baliq tutish</h3><div class=pond><div class=rodimg>${r==null?"<div class=norod>❌</div>":rodArt(r,70)}</div><div class=line id=ln><i>🪝</i></div><div class=emo id=em></div>

<p>💰 <b>${me.coin}</b> Coin · ${r==null?"Qarmoq sotib oling!":`<b>${ROD[r][0]}</b> qarmoq · ${ROD[r][2]-me.uses} ta baliq qoldi`}</p><button id=cb onclick="cast()" ${r==null?"disabled":""}>🎣 Tashlash</button></div>

function buy(i){if(me.coin<ROD[i][1])return N("Coin yetarli emas");me.coin=+(me.coin-ROD[i][1]).toFixed(1);me.rod=i;me.uses=0;last=null;save();render()}
function cast(){if(busy||me.rod==null)return;busy=1;last=null;
 const ti=Math.floor(Math.random()**2*(me.rod+1)),f=FISH[ti],nm=f[2][Math.floor(Math.random()*f[2].length)],pk=a=>a[Math.floor(Math.random()*a.length)];
 $("#ct").innerHTML="";$("#cb").disabled=true;const em=$("#em"),ln=$("#ln");em.textContent=pk(["🤞😬","🙏😮","😎🎣"]);em.className="emo on";ln.style.height="215px";
 setTimeout(()=>{const e2=$("#em"),l2=$("#ln");if(!l2)return;e2.textContent=pk(["💪😤","🔥😆","😲💪"]);l2.style.transition="height .8s cubic-bezier(.2,.8,.3,1)";l2.style.height="30px";l2.firstChild.innerHTML=`🪝<b class=hf>${fishArt(nm)}</b>`},1700);
 setTimeout(()=>{me.coin=+(me.coin+f[1]).toFixed(1);me.uses++;let br=false;if(me.uses>=ROD[me.rod][2]){me.rod=null;me.uses=0;br=true}last={nm,tier:f[0],coin:f[1],broke:br};save();busy=0;if(me.id&&tab=="game")render()},2700)}

function kidsV(){if(me.role=="creator")return admKids();const k=db.u.filter(x=>x.parent==me.id);
 return `<div class=cd><small class=mu>Farzandingiz o'z sozlamalarida sizning ID raqamingizni (<b>${me.id}</b>) 2 marta kiritishi kerak.</small></div>`+k.map(x=>{const d=gr(x.id).filter(g=>g.date==today()),good=d.filter(g=>g.score>=4).length,bad=d.filter(g=>g.score==2).length;
 return `<div class=cd><h4>${e(x.name)} — 🪙 ${x.coin}</h4>Bugun: ${d.map(g=>g.score).join(", ")||"baho yo'q"}<br>${good>=3?"🎉 Barakalla! Farzandingiz bugun 3 ta yaxshi baho oldi. Rahmat!":""}${bad>=2?`⚠️ 2 ta past baho. <button onclick="askAI('Farzandim bugun ikki marta 2 baho oldi. Uni qanday to\\'g\\'ri yo\\'lga qaytaraman?')">AI maslahat</button>`:""}</div>`}).join("")}

function aiV(){return `<div class=cd><h4>🤖 AI yordamchi</h4><small class=mu>Faqat maktab, ta'lim va tarbiya haqida.</small><div class=chat>${chat.map(m=>`<p><b>${m[0]}:</b> ${e(m[1])}</p>`).join("")||"<small class=mu>Savol bering…</small>"}</div><input id=aq placeholder="Savolingiz…" onkeydown="event.key=='Enter'&&askAI(v('aq'))"><button onclick="askAI(v('aq'))">Yuborish</button>
${me.role=="creator"||me.role=="director"?`<hr><input id=ak type=password placeholder="OpenAI API Key" value="${e(localStorage.key||"")}"><button class=g onclick="localStorage.key=v('ak');N('Saqlandi')">Kalitni saqlash</button>`:""}</div>`}
async function askAI(q){if(!q)return;tab="ai";chat.push(["Siz",q]);
 if(/so'kin|siktir|fuck|porn|18\+|jinni|sex/i.test(q)){db.rep.push({uid:me.id,text:q});save();chat.push(["AI","Bunday savollarga javob bera olmayman. Xabaringiz administratorga yuborildi."]);return render()}
 const key=CFG.OPENAI_KEY||localStorage.key;if(!key){chat.push(["AI","OpenAI kalit kiritilmagan."]);return render()}
 render();try{const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"system",content:"Sen NiceSchool.uz yordamchisisan. Faqat maktab, ta'lim, dars mavzulari va ota-onalarga farzand tarbiyasi bo'yicha javob ber. Boshqa, so'kinish yoki 18+ mavzularga rad javobini ber. Foydalanuvchi tilida javob ber."},{role:"user",content:q}]})});
 const j=await r.json();chat.push(["AI",j.choices?.[0]?.message?.content||"Xato: "+(j.error?.message||"")])}catch(x){chat.push(["AI","Ulanish xatosi"])}render()}

render();
